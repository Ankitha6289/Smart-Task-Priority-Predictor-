{% extends "base.html" %}
{% block title %}Server Error – Smart Task Priority Predictor{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="card border-0 shadow-sm p-4 p-sm-5">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 mx-auto"
           style="width: 84px; height: 84px; background: rgba(239, 68, 68, 0.12); color: var(--p-critical);">
        <i class="bi bi-shield-slash fs-1"></i>
      </div>
      <h2 class="fw-bold tracking-tight mb-2">500 &bull; Server Error</h2>
      <p class="text-muted small mb-4">
        An unexpected error occurred while processing this request. Our system logs have been flagged.
      </p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-sm">
          <i class="bi bi-speedometer2 me-1"></i>Back to Dashboard
        </a>
        <a href="javascript:history.back()" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-arrow-left me-1"></i>Go Back
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
