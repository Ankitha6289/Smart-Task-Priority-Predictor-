{% extends "base.html" %}
{% block title %}Page Not Found – Smart Task Priority Predictor{% endblock %}

{% block content %}
<div class="row justify-content-center py-5">
  <div class="col-md-7 col-lg-5 text-center">
    <div class="card border-0 shadow-sm p-4 p-sm-5">
      <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-3 mx-auto"
           style="width: 84px; height: 84px; background: rgba(249, 115, 22, 0.12); color: var(--p-high);">
        <i class="bi bi-compass fs-1"></i>
      </div>
      <h2 class="fw-bold tracking-tight mb-2">404 &bull; Page Not Found</h2>
      <p class="text-muted small mb-4">
        The task, dataset, or page you were trying to access does not exist or has been removed.
      </p>
      <div class="d-flex justify-content-center gap-2">
        <a href="{{ url_for('dashboard') }}" class="btn btn-primary btn-sm">
          <i class="bi bi-speedometer2 me-1"></i>Back to Dashboard
        </a>
        <a href="{{ url_for('task_list') }}" class="btn btn-outline-secondary btn-sm">
          <i class="bi bi-kanban me-1"></i>My Tasks
        </a>
      </div>
    </div>
  </div>
</div>
{% endblock %}
